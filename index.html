<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="description" content="Arsen Harutyunyan — Full Stack Developer (Python, Django, FastAPI, React, TypeScript) based in Yerevan, Armenia." />
    <title>Arsen Harutyunyan — Full Stack Developer</title>

    <!-- Link previews (LinkedIn, Telegram, WhatsApp, Slack, X). %SITE_URL% is filled in at build time. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Arsen Harutyunyan" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="Arsen Harutyunyan — Full Stack Developer" />
    <meta property="og:description" content="Python, Django, FastAPI, React and TypeScript developer from Yerevan. Explore my portfolio: it's a desktop OS in your browser." />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Arsen Harutyunyan, Full Stack Developer: Python, Django, FastAPI, React, TypeScript" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Arsen Harutyunyan — Full Stack Developer" />
    <meta name="twitter:description" content="Python, Django, FastAPI, React and TypeScript developer from Yerevan. Explore my portfolio: it's a desktop OS in your browser." />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />
    <script>
      // Apply the saved or system theme before first paint to avoid a flash.
      try {
        var saved = JSON.parse(localStorage.getItem('theme') || 'null')
        var theme = saved && saved.state && saved.state.theme
        if (!theme) theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.classList.toggle('dark', theme === 'dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
